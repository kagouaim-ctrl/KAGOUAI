<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAGOU 控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---- design tokens ----
   Neutrals carry the interface; color is reserved for meaning.
   accent (--signal) marks the one thing to act on; ok / review / block / info are business states only. */
:root{
  --bg:#0e0f11;--surface:#141518;--raise:#1b1c20;--elev:#202126;--line:#24262b;--line2:#30333a;
  --text:#e6e7e9;--text-2:#aeb1b8;--muted:#7d818a;
  --signal:#f0b90b;--signal-fg:#141006;--ok:#3fbf7f;--review:#e3a72a;--block:#f0544f;--info:#6f9dff;
  --ok-bg:rgba(63,191,127,.12);--review-bg:rgba(227,167,42,.12);--block-bg:rgba(240,84,79,.12);--info-bg:rgba(111,157,255,.12);--signal-bg:rgba(240,185,11,.12);
  --sans:Inter,"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  /* type scale */
  --fs-xs:11px;--fs-sm:12px;--fs-md:13px;--fs-base:14px;--fs-lg:16px;--fs-xl:20px;--fs-2xl:26px;--fs-3xl:32px;
  /* spacing: 4px steps */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;
  --r-sm:4px;--r:6px;
  --focus:0 0 0 2px var(--bg),0 0 0 4px rgba(240,185,11,.55);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f6f6f4;--surface:#ffffff;--raise:#f1f1ee;--elev:#ffffff;--line:#e4e4df;--line2:#d2d2cb;
  --text:#16171a;--text-2:#484c54;--muted:#6b6f78;
  --signal:#a87a00;--signal-fg:#ffffff;--ok:#13865a;--review:#a86f00;--block:#cc3a35;--info:#2f62d4;
  --ok-bg:rgba(19,134,90,.1);--review-bg:rgba(168,111,0,.1);--block-bg:rgba(204,58,53,.08);--info-bg:rgba(47,98,212,.08);--signal-bg:rgba(168,122,0,.1);
  --focus:0 0 0 2px var(--bg),0 0 0 4px rgba(168,122,0,.5);color-scheme:light;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-theme="light"])[data-auto="1"]{
  --bg:#f6f6f4;--surface:#ffffff;--raise:#f1f1ee;--elev:#ffffff;--line:#e4e4df;--line2:#d2d2cb;
  --text:#16171a;--text-2:#484c54;--muted:#6b6f78;
  --signal:#a87a00;--signal-fg:#ffffff;--ok:#13865a;--review:#a86f00;--block:#cc3a35;--info:#2f62d4;
  --ok-bg:rgba(19,134,90,.1);--review-bg:rgba(168,111,0,.1);--block-bg:rgba(204,58,53,.08);--info-bg:rgba(47,98,212,.08);--signal-bg:rgba(168,122,0,.1);
  --focus:0 0 0 2px var(--bg),0 0 0 4px rgba(168,122,0,.5);color-scheme:light}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs-base)/1.55 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.mono,code,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ok{color:var(--ok)} .review{color:var(--review)} .block{color:var(--block)} .info{color:var(--info)}
.label{font:500 var(--fs-sm)/1.4 var(--sans);color:var(--muted)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:var(--fs-xl)} h2{font-size:var(--fs-base)} h3{font-size:var(--fs-md)}

/* buttons and inputs: small radius, hairlines; every control has hover, focus, active and disabled states */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;border:1px solid var(--line2);background:var(--surface);border-radius:var(--r-sm);padding:6px 12px;cursor:pointer;font-size:var(--fs-md);font-weight:500;line-height:1.4;text-decoration:none;transition:background-color .12s,border-color .12s,color .12s}
.btn:hover{border-color:var(--muted);background:var(--raise)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav a:focus-visible,summary:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:0;box-shadow:var(--focus)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.primary:hover{opacity:.9;background:var(--text)}
.btn.signal{background:var(--signal);color:var(--signal-fg);border-color:var(--signal);font-weight:600}
.btn.signal:hover{filter:brightness(1.06);background:var(--signal)}
.btn.danger{border-color:var(--block);color:var(--block)}
.btn.danger:hover{background:var(--block-bg)}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.ok:hover{background:var(--ok-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--raise)}
.btn.sm{padding:3px 8px;font-size:var(--fs-sm)}
.btn:disabled,.btn[aria-busy="true"]{opacity:.5;cursor:not-allowed;transform:none}
.btn[aria-busy="true"]::before{content:"";width:10px;height:10px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
input,select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r-sm);padding:6px 8px;min-width:0;width:100%;transition:border-color .12s}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:disabled,select:disabled,textarea:disabled{opacity:.5;cursor:not-allowed}
textarea{resize:vertical;min-height:72px}
input[type=checkbox]{width:auto;accent-color:var(--signal)}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted)}
label.f > span:first-child{font:500 var(--fs-sm)/1.4 var(--sans);color:var(--text-2)}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text)}

/* layout */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.brand{display:flex;align-items:baseline;gap:8px;padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.brand b{font:700 17px/1 var(--sans);letter-spacing:.02em;font-stretch:125%}
.nav{display:flex;flex-direction:column;padding:var(--s2) var(--s2) var(--s4);overflow-y:auto;flex:1;scrollbar-width:thin;overscroll-behavior:contain}
.nav a{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:var(--r-sm);text-decoration:none;color:var(--text-2);font-size:var(--fs-md);line-height:20px;transition:background-color .12s,color .12s}
.nav a svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.nav a:hover{color:var(--text);background:var(--raise)}
.nav a:hover svg{color:var(--text-2)}
.nav a[aria-current="page"]{color:var(--text);background:var(--raise);font-weight:500;box-shadow:inset 2px 0 0 var(--signal)}
.nav a[aria-current="page"] svg{color:var(--text)}
.nav a .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav a .st{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.nav a .st.off{color:var(--review)}
.nav a.idle .t{color:var(--muted)}
.nav .ng{display:flex;align-items:center;gap:6px;padding:var(--s4) 10px var(--s1);font:500 var(--fs-xs)/1.4 var(--sans);color:var(--muted);letter-spacing:.02em}
.nav .ng:first-child{padding-top:var(--s1)}
.side-foot{border-top:1px solid var(--line);padding:12px 18px;display:grid;gap:6px;font-size:12px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 24px;flex-wrap:wrap}
.top h1{margin-right:auto}
.page{padding:20px 24px 80px;display:grid;gap:16px;max-width:1280px;width:100%}
.grid{display:grid;gap:16px}
.grid > *,.stack > *{min-width:0}
#simEx .btn,.sug .btn{white-space:normal;text-align:left}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card > .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card > .hd h2{margin-right:auto}
.card > .bd{padding:14px 16px}
.card > .bd.flush{padding:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:grid;gap:10px}
.kpi{padding:14px 16px;display:grid;gap:6px;align-content:start}
.kpi .v{font:500 24px/1.15 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums;word-break:break-all}
.kpi .s{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 var(--fs-sm)/1 var(--sans);padding:4px 8px;border:1px solid transparent;border-radius:999px;white-space:nowrap;background:var(--raise)}
.pill.ok{background:var(--ok-bg)} .pill.review{background:var(--review-bg)} .pill.block{background:var(--block-bg)} .pill.info{background:var(--info-bg)}
.pill.muted{color:var(--muted)}
.dot{width:6px;height:6px;display:inline-block;background:currentColor;border-radius:50%}
/* one badge: a count of things waiting on the owner */
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;font:600 var(--fs-xs)/1 var(--sans);font-variant-numeric:tabular-nums;background:var(--signal);color:var(--signal-fg);border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-sm);padding:2px 8px;border:1px solid var(--line2);border-radius:var(--r-sm);white-space:nowrap}
.chip.block{border-color:var(--block)} .chip.review{border-color:var(--review)} .chip.ok{border-color:var(--ok)}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 0 0 2px}
.scroll{overflow-x:auto}
#limits input{min-width:90px}
.msg,.report{overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font:500 var(--fs-sm)/1.4 var(--sans);color:var(--muted);border-bottom:1px solid var(--line);padding:8px 12px;white-space:nowrap;background:var(--surface);position:sticky;top:0}
td{border-bottom:1px solid var(--line);padding:9px 12px;vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--raise)}
td.r,th.r{text-align:right}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.bar{height:6px;background:var(--line);position:relative;border-radius:3px;overflow:hidden}
.bar > i{position:absolute;inset:0 auto 0 0;background:var(--text);border-radius:3px}
.bar.warn > i{background:var(--review)} .bar.over > i{background:var(--block)}
.addr{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px}
.copy{border:0;background:none;color:var(--muted);cursor:pointer;padding:0;font:11px var(--mono)}
.copy:hover{color:var(--text)}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;word-break:break-all}
.feed{display:grid}
.feed .it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px;align-items:start}
.feed .it:last-child{border-bottom:0}
.feed .it > div{min-width:0;overflow-wrap:anywhere}
.feed .k{font:500 10px/1.8 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:0 6px;border:1px solid var(--line2);color:var(--muted)}
.feed .k.alert{color:var(--block);border-color:var(--block)} .feed .k.audit{color:var(--text)} .feed .k.system{color:var(--info);border-color:var(--info)}
.feed .k.telegram_in,.feed .k.telegram_out{color:var(--signal);border-color:var(--signal)}
.feed .t{font:11px var(--mono);color:var(--muted);white-space:nowrap}
pre.report{white-space:pre-wrap;margin:0;font:13px/1.7 var(--sans);background:var(--bg);border:1px solid var(--line);padding:14px;border-radius:2px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-size:13px}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--signal)}
.note{border:1px solid var(--line2);border-left:2px solid var(--review);padding:10px 12px;font-size:13px;background:var(--bg)}
.note.block{border-left-color:var(--block)} .note.ok{border-left-color:var(--ok)} .note.info{border-left-color:var(--info)}
.steps{counter-reset:s;display:grid;gap:8px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;font-size:13px}
.steps li::before{content:counter(s,decimal-leading-zero);font:500 11px/1.9 var(--mono);color:var(--muted)}
.steps li.done::before{content:"✓";color:var(--ok)}

/* chat (Telegram simulator and log) */
.chat{display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--bg);height:420px;overflow-y:auto}
.msg{max-width:86%;padding:8px 10px;border:1px solid var(--line2);border-radius:2px;white-space:pre-wrap;font-size:13px;line-height:1.55;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--raise)}
.msg.bot{align-self:flex-start;background:var(--surface)}
.msg .who{display:block;font:500 10px/1.6 var(--mono);color:var(--muted);letter-spacing:.04em}
.chatbar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.sug{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}

/* chart */
.chart svg{display:block;width:100%;height:180px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;margin-right:6px}

/* drawer, modal, toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column}
.drawer .hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .bd{padding:16px;overflow:auto;display:grid;gap:16px;align-content:start}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line2);z-index:42;display:grid}
.modal .bd{padding:16px;display:grid;gap:12px}
.modal .ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.toasts{position:fixed;right:16px;bottom:16px;z-index:50;display:grid;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--surface);border:1px solid var(--line2);border-left:2px solid var(--ok);padding:10px 12px;font-size:13px}
.toast.bad{border-left-color:var(--block)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login .card{width:min(420px,100%)}

.demo{background:var(--signal);color:#0b0b0c;font-size:12px;padding:6px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.demo .home{margin-left:auto;color:#0b0b0c;font-weight:600;white-space:nowrap;border:1px solid #0b0b0c;padding:2px 8px;text-decoration:none}
.demo .home:hover{background:#0b0b0c;color:var(--signal)}
.brand .home{margin-left:auto;font-size:12px;color:var(--muted);text-decoration:none;white-space:nowrap}
.brand .home:hover{color:var(--text)}

/* team */
.av{width:34px;height:34px;flex:none;display:grid;place-items:center;border:1px solid var(--line2);font-weight:600;font-size:15px;background:var(--bg)}
.av.on{border-color:var(--signal);color:var(--signal)}
.emp .bd{display:grid;gap:12px}
.emp .grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.mini{display:grid;gap:2px;padding:8px 10px;border:1px solid var(--line);background:var(--bg);min-width:0}
.mini .num{font-size:18px;word-break:break-all}
.mini a{text-decoration:none}
.duties{margin:0;padding-left:18px;font-size:13px;color:var(--muted);display:grid;gap:2px}
.stack > [data-addrow]{justify-self:start}
.er{display:grid;gap:8px;align-items:start;margin-bottom:8px}
.er.c2{grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto}
.er.c3{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
.er.faq{grid-template-columns:minmax(0,1fr) auto;padding:10px;border:1px solid var(--line);background:var(--bg)}
.er.faq > .stack{gap:6px}
.sev{font:500 10px/1.8 var(--mono);letter-spacing:.06em;padding:0 6px;border:1px solid currentColor;white-space:nowrap}
.feed .k.support{color:var(--ok);border-color:var(--ok)} .feed .k.translate{color:var(--info);border-color:var(--info)}
.who-tag{font:500 10px/1.6 var(--mono);color:var(--muted);border:1px solid var(--line2);padding:0 4px;margin-left:6px;white-space:nowrap}
.result{border:1px solid var(--line2);padding:12px;display:grid;gap:8px;background:var(--bg)}
details > summary{cursor:pointer;color:var(--muted);font-size:12px}
.spin{display:inline-block;width:10px;height:10px;border:1px solid currentColor;border-right-color:transparent;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- shared bits of the design system ---- */
.money{display:inline-flex;align-items:baseline;gap:4px;white-space:nowrap}
.money .num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.money .unit{font-size:.78em;color:var(--muted);font-weight:500}
.lnk{border:0;background:none;padding:0;color:var(--text-2);cursor:pointer;font:inherit;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:2px}
.lnk:hover{color:var(--text);text-decoration-color:currentColor}
.tip{position:relative;display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--line2);font:600 9px/1 var(--sans);color:var(--muted);cursor:help;vertical-align:1px;margin-left:2px}
.tip:hover,.tip:focus-visible{color:var(--text);border-color:var(--muted)}
.tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:240px;padding:6px 8px;border-radius:var(--r-sm);background:var(--elev);border:1px solid var(--line2);color:var(--text);font:400 var(--fs-sm)/1.5 var(--sans);box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .12s;z-index:30;white-space:normal}
.tip:hover::after,.tip:focus-visible::after{opacity:1}
.dot.ok{color:var(--ok)}
/* skeleton while a page loads */
.sk{display:grid;gap:var(--s4)}
.sk i{display:block;border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 0,var(--raise) 50%,var(--surface) 100%);background-size:200% 100%;animation:skm 1.4s ease-in-out infinite}
@keyframes skm{from{background-position:100% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.sk i{animation:none}.btn,.nav a{transition:none}}

/* ---- finance overview ---- */
.ov-period{display:flex;align-items:baseline;gap:var(--s3);font-size:var(--fs-md);color:var(--text-2);margin-bottom:calc(var(--s2) * -1)}
.ov-period .muted{font-size:var(--fs-sm)}
.ovs-label{font-size:var(--fs-md);color:var(--text-2);display:flex;align-items:center;gap:4px}
/* the month band: one surface, three regions of different weight */
.ovs{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.35fr) minmax(0,.85fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ovs > div{padding:var(--s5) var(--s6);min-width:0;display:flex;flex-direction:column;gap:var(--s2)}
.ovs > div + div{border-left:1px solid var(--line)}
.ovs-big{display:flex;flex-direction:column;gap:2px;margin:2px 0 var(--s2)}
.ovs-big .money{font-size:var(--fs-3xl);font-weight:500;line-height:1.15}
.ovs-big .money .unit{font-size:var(--fs-lg)}
.ovs-split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4);margin:auto 0 0;padding-top:var(--s3);border-top:1px solid var(--line)}
.ovs-split dt{font-size:var(--fs-sm);color:var(--muted);display:flex;align-items:center;gap:6px}
.ovs-split dt i,.ovs-legend i,.ovc-legend i,.ovc-tip i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.ovs-split dd{margin:2px 0 0;font-size:var(--fs-lg);display:grid}
.ovs-num{font:500 var(--fs-3xl)/1.15 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ovs-num small{font:500 var(--fs-lg) var(--sans);color:var(--muted);margin-left:2px}
.ovs-stack{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;background:var(--line);margin-top:var(--s1)}
.ovs-stack i{min-width:3px}
.ovs-legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px var(--s3);font-size:var(--fs-sm);color:var(--text-2)}
.ovs-legend li{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.ovs-legend li b{margin-left:auto;font-weight:500;color:var(--text)}
.ovs-legend li.zero{color:var(--muted)} .ovs-legend li.zero b{color:var(--muted)}
.ovs-foot{margin-top:auto;font-size:var(--fs-sm);color:var(--muted)}
.ovs-foot b{color:var(--text-2);font-weight:500}
.ovs-block.has{background:color-mix(in srgb,var(--block) 6%,transparent);border-radius:0 var(--r) var(--r) 0}
.ovs-sub{font-size:var(--fs-md);color:var(--text-2);display:flex;flex-wrap:wrap;gap:4px}
.ovs-block .btn{align-self:flex-start;margin-top:auto}
.ovs-ok{display:flex;align-items:center;gap:var(--s2);padding:var(--s4) var(--s5);color:var(--text-2);font-size:var(--fs-md)}
/* panels: a header line and content, no nested boxes */
.ovpanel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;display:flex;flex-direction:column}
.ovpanel > header{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s5);min-height:48px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ovpanel > header h2{font-size:var(--fs-base);font-weight:600;display:flex;align-items:center;gap:var(--s2)}
.ovpanel > header .ovh-sub{font-size:var(--fs-sm)}
.ovpanel > header > :last-child:not(h2):not(.ovh-sub){margin-left:auto}
.ovpanel > header .ovh-sub b{color:var(--text-2);font-weight:500}
.ovq-panel.attn{border-color:color-mix(in srgb,var(--review) 45%,var(--line))}
.ov-empty{padding:var(--s8) var(--s5);text-align:center;color:var(--muted);font-size:var(--fs-md)}
.ov-empty a{color:var(--text-2)}
.ov-note{margin:auto 0 0;padding:var(--s3) var(--s5);font-size:var(--fs-sm);color:var(--muted);border-top:1px solid var(--line)}
.ov-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:var(--s4);align-items:stretch}
.ov-row.b{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
/* approvals queue */
.ovp{list-style:none;margin:0;padding:0}
.ovp li + li{border-top:1px solid var(--line)}
.ovp-row{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(0,2fr) 80px minmax(120px,auto);gap:var(--s4);align-items:center;width:100%;padding:10px var(--s5);border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.ovp-row:hover{background:var(--raise)}
.ovp-who{display:grid;min-width:0}
.ovp-who b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovp-who .mono{font-size:var(--fs-xs)}
.ovp-why{min-width:0;font-size:var(--fs-md);color:var(--text-2);display:flex;flex-direction:column;gap:2px}
.ovp-reason{font-size:var(--fs-sm);color:var(--review);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovp-age{font-size:var(--fs-sm);color:var(--muted);white-space:nowrap}
.ovp-amt{text-align:right;font-size:var(--fs-lg)}
.ovp-more{padding:var(--s2) var(--s5);border-top:1px solid var(--line);font-size:var(--fs-sm);color:var(--muted)}
.ovp-more a{color:var(--text-2)}
/* 14-day chart: CSS columns so text stays crisp and every day is focusable */
.ovc{padding:var(--s4) var(--s5) var(--s4);display:grid;gap:var(--s2)}
.ovc-plot{display:grid;grid-template-columns:28px minmax(0,1fr);gap:var(--s2);height:196px}
.ovc-y{display:flex;flex-direction:column;justify-content:space-between;text-align:right;font:var(--fs-xs)/1 var(--mono);color:var(--muted);margin:-5px 0}
.ovc-area{position:relative;min-width:0}
.ovc-grid{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--line)}
.ovc-grid:last-of-type{border-top-style:solid;border-color:var(--line2)}
.ovc-cols{position:absolute;inset:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.ovc-col{position:relative;display:flex;align-items:flex-end;justify-content:center;height:100%;padding:0;border:0;background:none;cursor:default;border-radius:var(--r-sm)}
.ovc-col:hover,.ovc-col.on{background:color-mix(in srgb,var(--text) 5%,transparent)}
.ovc-stack{display:flex;flex-direction:column;width:min(70%,28px);border-radius:3px 3px 0 0;overflow:hidden;gap:1px}
.ovc-stack i{display:block;min-height:2px}
.ovc-col.today .ovc-stack{outline:1px solid var(--line2);outline-offset:1px}
.ovc-zero{position:absolute;bottom:0;width:min(70%,28px);height:2px;background:var(--line2)}
.ovc-x{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;margin-left:36px;font:var(--fs-xs)/1 var(--mono);color:var(--muted);text-align:center;white-space:nowrap}
.ovc-legend{display:flex;gap:var(--s5);flex-wrap:wrap;font-size:var(--fs-sm);color:var(--text-2);margin-left:36px;padding-top:var(--s2)}
.ovc-legend span{display:inline-flex;align-items:center;gap:6px}
.ovc-legend b{font-weight:500;color:var(--text)}
.ovc-tip{position:absolute;top:0;z-index:5;display:grid;gap:3px;min-width:140px;padding:8px 10px;background:var(--elev);border:1px solid var(--line2);border-radius:var(--r-sm);box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:var(--fs-sm);pointer-events:none}
.ovc-tip span{display:flex;align-items:center;gap:6px}
.ovc-tip span b{margin-left:auto;padding-left:var(--s3);font-weight:500}
.ovc-tip > b{font:500 var(--fs-sm) var(--mono)}
/* quota */
.ovq{list-style:none;margin:0;padding:var(--s2) var(--s5) var(--s4);display:grid;gap:var(--s4)}
.ovq-hd{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);margin-bottom:6px}
.ovq-hd b{font-weight:600;font-size:var(--fs-md)}
.ovq-hd .num{font-size:var(--fs-md)}
.ovq-ft{font-size:var(--fs-sm);margin-top:4px}
.ovq .bar > i{background:var(--ok)}
.ovq .bar.warn > i{background:var(--review)} .ovq .bar.over > i{background:var(--block)}
/* payees table */
.ovt td,.ovt th{padding:10px var(--s5)}
.ovt th{background:transparent;position:static}
.ovt th[aria-sort]{color:var(--text-2)}
.ovt td{vertical-align:middle;font-size:var(--fs-md)}
.ovt-who{display:grid}
.ovt-who b{font-weight:500}
.ovt-who .mono{font-size:var(--fs-xs)}
.ovt tbody tr.click:focus-visible{outline:0;box-shadow:inset 2px 0 0 var(--signal)}
.ovt tbody tr.click:focus-visible td{background:var(--raise)}
.ovt .money{font-size:var(--fs-base)}
/* activity */
.ova{list-style:none;margin:0;padding:var(--s1) 0}
.ova-it{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:var(--s3);padding:10px var(--s5);align-items:start}
.ova-it + .ova-it{border-top:1px solid var(--line)}
.ova-dot{width:7px;height:7px;border-radius:50%;background:var(--line2);margin-top:7px}
.ova-it.warn .ova-dot{background:var(--review)} .ova-it.crit .ova-dot{background:var(--block)}
.ova-main{min-width:0}
.ova-t{font-size:var(--fs-md);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ova-k{font-size:var(--fs-xs);font-weight:600;color:var(--review);margin-right:6px}
.ova-it.crit .ova-k{color:var(--block)}
.ova-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:2px;font-size:var(--fs-sm);color:var(--muted)}
.ova-meta a,.ova-meta .lnk{color:var(--text-2);font-size:var(--fs-sm)}
.ova-meta .mono{font-size:var(--fs-xs)}
.ova-time{font-size:var(--fs-sm);color:var(--muted);white-space:nowrap;padding-top:1px}
.ova-tg{margin-left:auto;border:0;background:none;padding:0 2px;color:var(--muted);font:inherit;font-size:var(--fs-xs);cursor:pointer;opacity:0;transition:opacity .12s}
.ova-it:hover .ova-tg,.ova-tg:focus-visible,.ova-tg[aria-expanded="true"]{opacity:1}
.ova-tg:hover{color:var(--text)}
.ova-tg::after{content:" ▾"}
.ova-tg[aria-expanded="true"]::after{content:" ▴"}
@media (hover:none){.ova-tg{opacity:1}}
.ova-more{margin-top:6px}
.ova-more .kv{margin-top:6px;grid-template-columns:56px minmax(0,1fr);font-size:var(--fs-sm);gap:4px 10px;padding:8px 10px;background:var(--bg);border-radius:var(--r-sm)}
.ova-json{font-size:var(--fs-xs);word-break:break-all}
@media (max-width:1240px){
  .ovs{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .ovs-block{grid-column:1 / -1;flex-direction:row!important;flex-wrap:wrap;align-items:center;border-left:0!important;border-top:1px solid var(--line);gap:var(--s2) var(--s5)!important;border-radius:0 0 var(--r) var(--r)!important}
  .ovs-block .ovs-num{font-size:var(--fs-2xl)}
  .ovs-block .btn{margin:0 0 0 auto}
  .ov-row,.ov-row.b{grid-template-columns:minmax(0,1fr)}
  .ov-quota .ovq{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
}
@media (max-width:860px){
  .ovs{grid-template-columns:minmax(0,1fr)}
  .ovs > div{padding:var(--s4)}
  .ovs > div + div{border-left:0;border-top:1px solid var(--line)}
  .ovs-big .money,.ovs-num{font-size:var(--fs-2xl)}
  .ovs-block{flex-direction:column!important;align-items:flex-start}
  .ovs-block .btn{margin:0}
  .ovpanel > header{padding:var(--s3) var(--s4)}
  .ovp-row{grid-template-columns:minmax(0,1fr) auto;gap:4px var(--s3);padding:10px var(--s4)}
  .ovp-why{grid-column:1 / -1;grid-row:2}
  .ovp-age{display:none}
  .ovc{padding:var(--s3) var(--s4)}
  .ovc-plot{height:160px}
  .ovt td,.ovt th{padding:10px var(--s4)}
  .ova-it{padding:10px var(--s4)}
  .ov-period{flex-wrap:wrap}
}

const EMP_PAGES=['support','monitor','translator','payouts','sybil'];
const S={status:null,route:'team',team:null,ledger:{limit:100,f:{}},audit:{kind:'',items:[]},dirtyRules:false};
function route(){const r=(location.hash||'#team').slice(1).split('?')[0];return PAGES.some(p=>p[0]===r)?r:'team'}
const member=role=>(S.team?.members||[]).find(m=>m.role===role);
const roleName=role=>member(role)?.name||(S.team?.roles||[]).find(r=>r.id===role)?.name||role;
function renderNav(){const pend=S.status?.pending||0;let g='',out='';
  const todo=Object.fromEntries((S.team?.members||[]).map(m=>[m.role,m.todo?.value||0]));
  for(const [k,l,grp,role] of PAGES){
    if(grp!==g){g=grp;out+=`<div class="ng">${esc(grp==='财务'&&member('finance_ops')?member('finance_ops').name:grp)}</div>`}
    const m=role&&member(role),emp=EMP_PAGES.includes(k);
    const state=emp?(m?(m.enabled?'':'<span class="st off">停用</span>'):'<span class="st">未雇佣</span>'):'';
    const badge=k==='approvals'?pend:(emp&&m?todo[role]:0);
    out+=`<a href="#${k}" class="${emp&&!(m&&m.enabled)?'idle':''}" ${S.route===k?'aria-current="page"':''}><svg viewBox="0 0 16 16" aria-hidden="true">${NAV_ICON[k]||''}</svg><span class="t">${l}</span>${state}${badge?`<span class="badge" aria-label="${badge} 项待处理">${badge}</span>`:''}</a>`}
  $('#nav').innerHTML=out}
function renderTop(){const s=S.status||{};
  const pg=PAGES.find(p=>p[0]===S.route);
  $('#title').textContent=EMP_PAGES.includes(pg[0])&&member(pg[3])?member(pg[3]).name:pg[1];
  const pills=[s.live?'<span class="pill block"><span class="dot"></span>实盘</span>':'<span class="pill muted"><span class="dot"></span>测试模式</span>'];
  if(s.read_only)pills.push('<span class="pill review">试用只读</span>');
  if(s.paused)pills.push('<span class="pill block">已暂停</span>');
  $('#pills').innerHTML=pills.join('');
  $('#kill').textContent=s.paused?'恢复付款':'一键暂停';$('#kill').className='btn sm '+(s.paused?'ok':'danger');
  $('#footMode').textContent=s.live?'实盘：绿灯付款会真的上链':'测试模式：不会真的上链';
  $('#footTime').textContent=fmtTime(new Date().toISOString(),false);
  renderNav();}
$('#kill').onclick=async()=>{const p=S.status?.paused;
  if(!p&&!await confirmBox('暂停所有付款？','暂停后员工收到的每一笔付款请求都会被拦截，直到你恢复。已经在链上的交易不受影响。','暂停',true))return;
  act(()=>post(p?'/api/resume':'/api/pause'))};
$('#refresh').onclick=()=>refresh(true);

async function refresh(say){
  try{
    const [s,r,t]=await Promise.all([api('/api/status'),api('/api/rules'),api('/api/team')]);
    S.status={...s,read_only:!!r.read_only};S.rules=r;S.team=t;TZ=r.timezone||TZ;
    renderTop();await render();if(say)toast('已刷新');
  }catch(e){toast(e.message,true)}
}
window.addEventListener('hashchange',()=>{if(S.dirtyRules&&S.route==='rules'&&!confirm('规则还没保存，确定离开？')){history.replaceState(null,'','#rules');return}S.dirtyRules=false;S.route=route();renderTop();render();window.scrollTo(0,0)});

async function render(){
  const page=$('#page');
  document.body.classList.toggle('tgmode',S.route==='chat');
  if(S.painted!==S.route){S.painted=S.route;page.setAttribute('aria-busy','true');
    const sk=setTimeout(()=>{if(page.getAttribute('aria-busy'))page.innerHTML=S.route==='overview'?'<div class="sk" aria-label="加载中"><i style="height:180px"></i><i style="height:120px"></i><div class="ov-row"><i style="height:300px"></i><i style="height:300px"></i></div></div>':'<div class="sk" aria-label="加载中"><i style="height:120px"></i><i style="height:320px"></i></div>'},120);
    try{page.innerHTML=await VIEWS[S.route]();BIND[S.route]&&BIND[S.route]()}catch(e){page.innerHTML=`<div class="note block">这一页没加载出来：${esc(e.message)}<div style="margin-top:8px"><button class="btn sm" onclick="location.reload()">重新加载</button></div></div>`}
    finally{clearTimeout(sk);page.removeAttribute('aria-busy')}return}
  try{page.innerHTML=await VIEWS[S.route]();BIND[S.route]&&BIND[S.route]()}
  catch(e){page.innerHTML=`<div class="note block">这一页没加载出来：${esc(e.message)}</div>`}
}

// ---------- 01 overview ----------
function feed(items,empty='暂无记录',who=true){return items.length?`<div class="feed">${items.map(e=>`<div class="it"><span class="k ${esc(e.kind)}">${KIND[e.kind]||esc(e.kind)}</span><div>${esc(e.text).replace(/\n/g,'<br>')}${(e.actor&&e.actor!==e.employee)||(who&&e.employee)?`<div class="muted" style="font-size:12px">${esc(e.actor&&e.actor!==e.employee?e.actor:'')}${who&&e.employee?`<span class="who-tag">${esc(roleName(e.employee))}</span>`:''}</div>`:''}</div><span class="t">${fmtTime(e.at)}</span></div>`).join('')}</div>`:`<div class="empty">${empty}</div>`}
const VIEWS={},BIND={};
// Order follows what the owner needs first: money moved this month and how it was handled,
// what is waiting on their signature, then the trend, today's room, who got paid and what happened.
const OV_OUT=[ // month outcomes, in the order a request can end up; colors are business states
  ['paid','员工自动付','var(--ok)'],['approved','老板已签','var(--info)'],['executing','执行中','var(--text-2)'],
  ['pending_approval','等你签字','var(--review)'],['rejected','已驳回','var(--muted)'],['failed','失败','var(--block)'],['blocked','拦截','var(--block)']];
const OV_SERIES=[['auto','自动付','var(--ok)'],['approval','需签字','var(--review)'],['block','拦截','var(--block)']];
// Money as "15,699 USDT": integer digits carry the weight, the unit stays quiet.
const ovMoney=(v,t,cls='')=>`<span class="money ${cls}"><span class="num">${fmtNum(v)}</span><span class="unit">${esc(t)}</span></span>`;
const ovMoneyList=m=>{const e=Object.entries(m||{});return e.length?e.map(([t,v])=>ovMoney(v,t)).join(''):ovMoney(0,'')};
function ovSub(a,b){const out={};for(const [t,v] of Object.entries(a||{})){const d=Number(v)-Number((b||{})[t]||0);if(Math.abs(d)>1e-9)out[t]=String(Math.round(d*1e6)/1e6)}return out}
// Axis top: even, so the middle gridline is a whole number too.
function ovNiceMax(n){if(n<=10)return Math.max(2,Math.ceil(n/2)*2);const u=Math.pow(10,Math.floor(Math.log10(n)))/5*2;return Math.ceil(n/u)*u}
function ovChart(series){
  const tot=series.map(d=>d.auto+d.approval+d.block),max=ovNiceMax(Math.max(...tot,0)),ticks=[max,max/2,0];
  const sum=k=>series.reduce((a,d)=>a+d[k],0);
  const step=Math.ceil(series.length/7),today=series.length-1;
  return `<div class="ovc" role="group" aria-label="近 ${series.length} 天付款请求，按处理结果">
    <div class="ovc-plot">
      <div class="ovc-y" aria-hidden="true">${ticks.map(t=>`<span>${Number.isInteger(t)?t:t.toFixed(1)}</span>`).join('')}</div>
      <div class="ovc-area">
        ${ticks.map((t,i)=>`<i class="ovc-grid" style="top:${i*50}%"></i>`).join('')}
        <div class="ovc-cols">${series.map((d,i)=>{const n=tot[i];
          return `<button type="button" class="ovc-col${i===today?' today':''}" data-i="${i}" aria-label="${esc(d.date)}：自动付 ${d.auto}，需签字 ${d.approval}，拦截 ${d.block}">
            <span class="ovc-stack" style="height:${n/max*100}%">${OV_SERIES.map(([k,,c])=>d[k]?`<i style="flex:${d[k]};background:${c}"></i>`:'').reverse().join('')}</span>
            ${n?'':'<span class="ovc-zero"></span>'}</button>`}).join('')}</div>
        <div class="ovc-tip" id="ovTip" role="status" hidden></div>
      </div>
    </div>
    <div class="ovc-x" aria-hidden="true">${series.map((d,i)=>`<span>${i===today?'今天':i%step===0&&today-i>=step?esc(d.date.slice(5).replace('-','/')):''}</span>`).join('')}</div>
    <div class="ovc-legend">${OV_SERIES.map(([k,l,c])=>`<span><i style="background:${c}"></i>${l}<b class="num">${sum(k)}</b></span>`).join('')}</div>
  </div>`}
function ovQuota(b){
  if(!b.length)return `<div class="ov-empty">还没设每日自动付上限。<a href="#rules">去规则里设置</a></div>`;
  return `<ul class="ovq">${b.map(x=>{const spent=Number(x.spent),lim=Number(x.limit);
    const off=!(lim>0),p=off?0:Math.min(100,spent/lim*100),over=!off&&spent>lim,warn=!off&&!over&&p>=80;
    const state=off?'<span class="muted">未开启自动付</span>':over?`<span class="block">超出 ${fmtNum(spent-lim)}</span>`:spent>=lim?'<span class="block">已用满</span>':warn?`<span class="review">已用 ${Math.round(p)}%</span>`:`<span class="muted">剩余 ${fmtNum(lim-spent)}</span>`;
    return `<li><div class="ovq-hd"><b>${esc(x.token)}</b><span class="num"><span class="${spent?'':'muted'}">${fmtNum(spent)}</span><span class="muted"> / ${fmtNum(lim)}</span></span></div>
      <div class="bar ${over||(!off&&spent>=lim)?'over':warn?'warn':''}" role="progressbar" aria-label="${esc(x.token)} 今日已自动付" aria-valuemin="0" aria-valuemax="${esc(x.limit)}" aria-valuenow="${esc(x.spent)}"><i style="width:${p}%"></i></div>
      <div class="ovq-ft">${state}</div></li>`}).join('')}</ul>`}
const OV_OBJ=[ // what an event is about, and where to look at it
  ['request_id',v=>[`付款 ${short(String(v))}`,`data-detail="${esc(v)}"`]],
  ['batch',v=>[`结算批次 #${v}`,'href="#payouts"']],['check',v=>[`反女巫检查 #${v}`,'href="#sybil"']],
  ['role',v=>[roleName(v),'href="#team"']],['changes',()=>['规则','href="#rules"']]];
function ovActivity(items){
  if(!items.length)return '<div class="ov-empty">还没有操作或预警。员工付款、老板签字、规则修改都会出现在这里。</div>';
  return `<ol class="ova">${items.map(e=>{const d=e.data||{};let obj='';
    for(const [k,f] of OV_OBJ)if(d[k]!=null){const [l,attr]=f(d[k]);obj=attr.startsWith('href')?`<a ${attr}>${esc(l)}</a>`:`<button type="button" class="lnk" ${attr}>${esc(l)}</button>`;break}
    if(!obj&&d.url)obj=`<a href="${esc(d.url)}" target="_blank" rel="noreferrer">链上交易</a>`;
    const alert=e.kind==='alert',sev=d.severity==='high'||d.severity==='critical';
    const who=e.actor==='console'?'控制台':e.actor||'';
    const head=String(e.text).split('\n')[0];
    return `<li class="ova-it ${alert?(sev?'crit':'warn'):''}">
      <span class="ova-dot" aria-hidden="true"></span>
      <div class="ova-main"><div class="ova-t">${alert?`<span class="ova-k">${sev?'高危预警':'预警'}</span>`:''}${esc(head)}</div>
        <div class="ova-meta">${obj?`${obj}<span aria-hidden="true">·</span>`:''}${e.employee?`<span>${esc(roleName(e.employee))}</span>`:''}${who&&who!==e.employee?`<span aria-hidden="true">·</span><span class="mono">${esc(who)}</span>`:''}<button type="button" class="ova-tg" aria-expanded="false" aria-controls="ova${e.id}">详情</button></div>
        <div class="ova-more" id="ova${e.id}" hidden><dl class="kv"><dt>时间</dt><dd class="mono">${esc(fmtTime(e.at))}</dd><dt>类型</dt><dd>${KIND[e.kind]||esc(e.kind)}</dd><dt>操作人</dt><dd class="mono">${esc(e.actor||'—')}</dd><dt>原文</dt><dd>${esc(e.text).replace(/\n/g,'<br>')}</dd>${Object.keys(d).length?`<dt>数据</dt><dd><code class="ova-json">${esc(JSON.stringify(d))}</code></dd>`:''}</dl></div></div>
      <time class="ova-time" datetime="${esc(e.at)}" title="${esc(fmtTime(e.at))}">${ago(e.at)}</time></li>`}).join('')}</ol>`}
function ovQueue(rows,total){
  if(!total)return `<div class="ovs-ok"><span class="dot ok" aria-hidden="true"></span>没有等你签字的付款。员工遇到超额、需审批的类别或收款人时会排到这里。</div>`;
  return `<ul class="ovp">${rows.map(r=>`<li><button type="button" class="ovp-row" data-detail="${esc(r.request_id)}">
      <span class="ovp-who"><b>${r.payee_name?esc(r.payee_name):'<span class="block">白名单外</span>'}</b><span class="mono muted" title="${esc(r.payee)}">${esc(short(r.payee))}</span></span>
      <span class="ovp-why">${esc(r.memo||'')}${r.messages&&r.messages.length?`<span class="ovp-reason">${esc(r.messages[0])}${r.messages.length>1?` 等 ${r.messages.length} 条`:''}</span>`:''}</span>
      <span class="ovp-age" title="${esc(fmtTime(r.created_at))}">${ago(r.created_at)}</span>
      <span class="ovp-amt">${ovMoney(r.amount,r.token)}</span></button></li>`).join('')}</ul>
    ${total>rows.length?`<div class="ovp-more">还有 ${total-rows.length} 笔 · <a href="#approvals">全部审批</a></div>`:''}`}
VIEWS.overview=async()=>{

  const rate=m.automation_rate,blocked=c.blocked||0,signed=ovSub(m.moved,m.auto_paid);

  return `
  ${o.status.paused?'<div class="note block"><b>付款已暂停。</b> 所有新请求都会被拦截。点右上角「恢复付款」恢复。</div>':''}

  <div class="ov-period"><span>${monthName} · ${esc(m.start.slice(5).replace('-','/'))} 至今</span><span class="muted">时区 ${esc(TZ)}</span></div>

      <div class="ovs-foot">本月共 <b class="num">${total}</b> 笔请求</div>`:'<div class="ovs-foot">本月还没有付款请求。</div>'}
    </div>
    <div class="ovs-block ${blocked?'has':''}">
      <div class="ovs-label">本月拦截</div>
      <div class="ovs-num ${blocked?'block':''}">${blocked}<small> 笔</small></div>

      ${blocked?'<button type="button" class="btn sm" id="ovBlocked">查看拦截记录</button>':''}

    ${ovQueue(pend,o.pending)}

    <section class="ovpanel ov-quota"><header><h2>今日自动付额度</h2><span class="muted ovh-sub">今天 ${o.today.requests} 笔请求</span></header>${ovQuota(o.today.budget)}

      tip.hidden=false;const a=area.getBoundingClientRect(),r=col.getBoundingClientRect();

const TZS=['Asia/Shanghai','Asia/Hong_Kong','Asia/Singapore','Asia/Tokyo','Asia/Seoul','Asia/Dubai','Europe/London','Europe/Berlin','America/New_York','America/Los_Angeles','UTC'];
VIEWS.rules=async()=>{const r=S.rules,tokens=[...new Set([...Object.keys(r.single_limit||{}),...Object.keys(r.daily_limit||{})])];

    <div class="row" style="padding:10px 12px;border-top:1px solid var(--line)"><input id="newTok" class="mono" style="width:120px" placeholder="币种，如 USDC"><button class="btn sm" id="addTok">添加币种</button><span class="muted" style="font-size:12px">超过单笔上限要老板签字；当天自动付累计超过每日上限也要签字。</span></div>`,{flush:true})}
  ${card('审批与检测',`<div class="stack">
    <label class="f"><span>需审批类别（逗号分隔）</span><input id="cats" value="${esc((r.approval_categories||[]).join(', '))}" placeholder="KOL, 空投"></label>

    <label class="f"><span>时区（"每日"按这个时区算）</span><select id="tz">${[...new Set([r.timezone,...TZS])].map(z=>`<option ${z===r.timezone?'selected':''}>${esc(z)}</option>`).join('')}</select></label>

  </div>`)}
  <div class="row"><button class="btn primary" id="saveRules">保存规则</button><button class="btn ghost" id="resetRules">撤销修改</button><span id="dirty" class="review" hidden>有未保存的修改</span></div>
  <p class="muted" style="margin:0;font-size:12px">白名单和风险地址在 <a href="#payees">收款人</a> 页管理。保存后机器人从下一条消息起按新规则执行，修改会记进审计日志。</p>
  </div>
  <div class="stack" style="gap:16px">
  ${card('规则试算',`<div class="stack">
    <p class="muted" style="margin:0">输入一句群里会出现的付款请求，看员工会怎么处理。只是试算：不记账、不付款、不发到群里。按的是<b>已保存</b>的规则。</p>
    <div class="row"><input id="simText" class="grow" style="width:auto" placeholder="付 Alice 300 USDT 设计费"><button class="btn signal" id="simGo">试算</button></div>
    <div class="row" id="simEx">${['付 Alice 300 USDT 设计费','付 Alice 800 USDT 视频','付 Mia 200 USDT KOL 推广','付 0x9f3c000000000000000000000000000000004a21 50 USDT','给 bob 0.1 BNB gas'].map(x=>`<button class="btn sm ghost" data-ex="${esc(x)}">${esc(x)}</button>`).join('')}</div>
    <div id="simOut"></div></div>`)}
  ${card('当前生效的规则',`<pre class="report" id="rulesText">加载中…</pre>`)}
  </div></div>`};
BIND.rules=async()=>{
  const mark=()=>{S.dirtyRules=true;$('#dirty').hidden=false};
  document.querySelectorAll('#page input,#page select').forEach(i=>{if(!['simText','newTok'].includes(i.id))i.addEventListener('input',mark)});
  const collect=()=>{const c=JSON.parse(JSON.stringify(S.rules)),list=s=>s.split(/[,，]/).map(x=>x.trim()).filter(Boolean);
    c.single_limit={};c.daily_limit={};document.querySelectorAll('#limits tbody tr').forEach(tr=>{c.single_limit[tr.dataset.tok]=tr.querySelector('[data-s]').value.trim();c.daily_limit[tr.dataset.tok]=tr.querySelector('[data-d]').value.trim()});
    c.approval_categories=list($('#cats').value);c.duplicate_window_days=parseInt($('#dup').value,10)||30;c.timezone=$('#tz').value;c.owners=list($('#owners').value);c.read_only=$('#ro').checked;return c};
  $('#saveRules').onclick=async()=>{const c=collect();try{const r=await put('/api/rules',c);S.dirtyRules=false;toast(r.changes.length?'已保存：'+r.changes.join('；'):'没有改动');await refresh()}catch(e){toast(e.message,true)}};
  $('#resetRules').onclick=()=>{S.dirtyRules=false;render()};
  $('#addTok').onclick=()=>{const t=$('#newTok').value.trim().toUpperCase();if(!/^[A-Z0-9]{2,10}$/.test(t))return toast('币种代码 2–10 位字母或数字',true);
    if(document.querySelector(`#limits tr[data-tok="${t}"]`))return toast('已经有 '+t,true);
    $('#limits tbody').insertAdjacentHTML('beforeend',`<tr data-tok="${esc(t)}"><td class="mono">${esc(t)}</td><td><input class="mono" data-s value="0"></td><td><input class="mono" data-d value="0"></td><td><button class="btn sm ghost" data-rmtok>移除</button></td></tr>`);$('#newTok').value='';mark()};
  $('#limits').onclick=e=>{const b=e.target.closest('[data-rmtok]');if(b){b.closest('tr').remove();mark()}};
  const sim=async()=>{const text=$('#simText').value.trim();if(!text)return;try{const r=await post('/api/simulate',{text});
    if(!r.parsed){$('#simOut').innerHTML=`<div class="note">员工没看懂这句话，会在群里追问：<br>${esc(r.reply)}</div>`;return}
    const [l,c]=OUTCOME[r.outcome];
    $('#simOut').innerHTML=`<div class="stack"><div class="row"><span class="pill ${c}"><span class="dot"></span>${l}</span><span>${r.payee_name?esc(r.payee_name):`<span class="mono">${esc(short(r.payee))}</span>`} · ${fmtAmt(r.amount,r.token)}</span>${r.category?`<span class="chip">${esc(r.category)}</span>`:''}</div>
      ${r.messages.length?`<div class="row">${r.messages.map(m=>`<span class="chip ${c}">${esc(m)}</span>`).join('')}</div>`:'<span class="muted">所有规则都通过</span>'}
      <span class="label">员工在群里会这样回</span><div class="chat" style="height:auto;max-height:260px"><div class="msg me"><span class="who">你</span>${esc(text)}</div><div class="msg bot"><span class="who">KAGOU 员工</span>${esc(r.reply)}</div></div></div>`}catch(e){toast(e.message,true)}};
  $('#simGo').onclick=sim;$('#simText').onkeydown=e=>{if(e.key==='Enter')sim()};
  document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{$('#simText').value=b.dataset.ex;sim()});
  try{$('#rulesText').textContent=(await api('/api/preview/rules')).text}catch(e){$('#rulesText').textContent=e.message}};

  S.tgc.draft[chat]='';S.tgc.menu=false;S.tgc.typing={chat,who:b.name};

// ---------- shared: hire flow, row editors ----------
function promptBox(title,body,label,value,okText='确定',maxlen=30){return new Promise(res=>{
  $('#overlay').innerHTML=`<div class="scrim" data-x></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="bd"><h2 id="mt">${esc(title)}</h2>${body?`<div class="muted">${body}</div>`:''}<label class="f"><span>${esc(label)}</span><input id="pv" value="${esc(value||'')}" maxlength="${maxlen}"></label></div><div class="ft"><button class="btn" data-x>取消</button><button class="btn primary" data-ok>${esc(okText)}</button></div></div>`;
  const close=v=>{$('#overlay').innerHTML='';res(v)};
  $('#overlay').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>close(null));
  const ok=()=>close($('#pv').value.trim());$('#overlay').querySelector('[data-ok]').onclick=ok;
  $('#pv').onkeydown=e=>{if(e.key==='Enter')ok()};$('#pv').focus();$('#pv').select()})}
const ROLE_PAGE={finance_ops:'overview',community_support:'support',chain_monitor:'monitor',announcement_translator:'translator',campaign_payouts:'payouts',airdrop_sybil:'sybil'};
async function hireFlow(id){const r=(S.team?.roles||[]).find(x=>x.id===id);if(!r)return;
  const body=`${esc(r.summary)}<ul class="duties" style="margin-top:8px">${r.duties.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>${r.needs.length?`<p style="margin:8px 0 0">上岗前需要：${r.needs.map(esc).join('、')}</p>`:''}<p style="margin:8px 0 0">${r.touches_money?'这个岗位会动钱，所有付款都受规则引擎和限额约束。':'这个岗位只读、回答和起草，不碰钱。'}</p>`;
  const name=await promptBox('雇佣'+r.name,body,'在群里的称呼',r.name,'雇佣');if(name===null)return;
  try{await post('/api/team/hire',{role:id,name:name||r.name});toast(`${name||r.name} 已上岗`);await refresh();location.hash='#'+ROLE_PAGE[id]}catch(e){toast(e.message,true)}}
async function toggleRole(role,on){
  if(!on&&!await confirmBox(`停用${roleName(role)}？`,'停用后机器人不再以这个身份回复，也不发它的通知和预警。设置和记录都保留，随时可以重新上岗。','停用',true))return;
  act(()=>put('/api/team/'+role,{enabled:on}),on?'已上岗':'已停用')}
document.addEventListener('click',async e=>{
  const h=e.target.closest('[data-hire]');if(h){e.preventDefault();return hireFlow(h.dataset.hire)}
  const t=e.target.closest('[data-toggle-role]');if(t){e.preventDefault();return toggleRole(t.dataset.toggleRole,t.dataset.on==='1')}
  const a=e.target.closest('[data-addrow]');if(a){const box=document.getElementById(a.dataset.addrow);box.insertAdjacentHTML('beforeend',EDITORS[a.dataset.addrow].row({}));box.lastElementChild.querySelector('input,textarea')?.focus();return}
  const d=e.target.closest('[data-delrow]');if(d){d.closest('.er').remove()}});
const EDITORS={};
function rowsEditor(id,rows,cols,cls,addText='添加一行'){
  const row=r=>`<div class="er ${cls}">${cols.map(c=>c.ta?`<textarea data-k="${c.k}" placeholder="${esc(c.ph)}" aria-label="${esc(c.ph)}">${esc(r[c.k]??'')}</textarea>`:`<input data-k="${c.k}" class="${c.mono?'mono':''}" placeholder="${esc(c.ph)}" aria-label="${esc(c.ph)}" value="${esc(r[c.k]??'')}">`).join('')}<button class="btn sm ghost" data-delrow title="删除这一行">删除</button></div>`;
  EDITORS[id]={row};return `<div id="${id}">${rows.map(row).join('')}</div><button class="btn sm" data-addrow="${id}">+ ${esc(addText)}</button>`}
function faqEditor(id,rows){
  const row=r=>`<div class="er faq"><div class="stack"><input data-k="q" placeholder="问题，例如：什么时候上线？" aria-label="问题" value="${esc(r.q||'')}"><input data-k="keywords" placeholder="关键词，用逗号分开：上线, launch, 主网" aria-label="关键词" value="${esc((r.keywords||[]).join(', '))}"><textarea data-k="a" placeholder="回答（机器人会原文发出，不会改写）" aria-label="回答">${esc(r.a||'')}</textarea></div><button class="btn sm ghost" data-delrow>删除</button></div>`;
  EDITORS[id]={row};return `<div id="${id}" class="stack" style="gap:8px">${rows.map(row).join('')}</div><button class="btn sm" data-addrow="${id}" style="margin-top:8px">+ 添加问题</button>`}
const collect=id=>[...document.getElementById(id).children].map(el=>Object.fromEntries([...el.querySelectorAll('[data-k]')].map(i=>[i.dataset.k,i.value.trim()])));
const splitList=v=>v.split(/[,，、\n]+/).map(x=>x.trim()).filter(Boolean);
function notHired(role){const r=(S.team?.roles||[]).find(x=>x.id===role);
  return `<section class="card"><div class="hd"><span class="av">${esc(r.name[0])}</span><h2>${esc(r.name)}</h2><span class="pill muted">未雇佣</span></div><div class="bd stack">
  <p style="margin:0">${esc(r.summary)}</p><ul class="duties">${r.duties.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>
  ${r.needs.length?`<p class="muted" style="margin:0;font-size:12px">上岗前需要：${r.needs.map(esc).join('、')}</p>`:''}
  <div><button class="btn signal" data-hire="${r.id}">雇佣${esc(r.name)}</button></div></div></section>`}
const offNote=role=>{const m=member(role);return m&&!m.enabled?`<div class="note block row"><span class="grow"><b>${esc(m.name)}已停用。</b>机器人不会以这个身份回复，也不发它的通知。设置照常可以改。</span><button class="btn sm ok" data-toggle-role="${role}" data-on="1">重新上岗</button></div>`:''};
const kpi=(l,v,s='',cls='')=>`<section class="card kpi"><span class="label">${l}</span><span class="v ${cls}">${v}</span><span class="s">${s}</span></section>`;

async function download(path,demoMsg){if(window.CONSOLE_DEMO)return toast(demoMsg||'演示版不能下载文件。正式版点这里会下载文件。');
  try{const r=await fetch(path,{headers:{'Authorization':'Bearer '+token}});if(!r.ok){const b=await r.json().catch(()=>({}));throw new Error(b.detail||('下载失败 '+r.status))}
    const name=(r.headers.get('content-disposition')||'').match(/filename="([^"]+)"/)?.[1]||'export';
    const url=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已下载 '+name)}
  catch(e){toast(e.message,true)}}

const MODE_HELP={fixed:'名单每行：地址,金额[,备注]。例如 0xabc…,300,KOL 小王',pool:'名单每行：地址,积分[,备注]。奖池按积分比例分，向下取整到 6 位小数'};
function payItems(items,limit=300){return items.length?`<div class="scroll"><table><thead><tr><th>行</th><th>地址</th><th style="text-align:right">数量</th><th>结果</th></tr></thead><tbody>${items.slice(0,limit).map(i=>`<tr><td class="mono muted">${i.line}</td><td class="mono" style="white-space:nowrap">${esc(short(i.address)||i.address)}${i.note?`<div class="muted" style="font-size:11px">${esc(i.note)}</div>`:''}</td><td class="num" style="text-align:right">${i.status==='ok'?fmtNum(i.amount):'—'}</td><td>${i.status==='ok'?(i.adjusted.length?`<span class="pill review">已调整</span><div class="muted" style="font-size:11px">${i.adjusted.map(esc).join('；')}</div>`:'<span class="pill ok">发放</span>'):`<span class="pill block">剔除</span><div class="muted" style="font-size:11px">${i.reasons.map(esc).join('；')}</div>`}</td></tr>`).join('')}</tbody></table></div>${items.length>limit?`<p class="muted" style="font-size:12px;margin:8px 16px">只显示前 ${limit} 行，共 ${items.length} 行。</p>`:''}`:'<div class="empty">没有行</div>'}
function paySummary(s,token){return `<div class="grid g4" style="gap:8px"><div class="mini"><span class="label">可发放</span><span class="num">${s.payable}</span></div><div class="mini"><span class="label">合计</span><span class="num">${fmtNum(s.total)} ${esc(token)}</span></div><div class="mini"><span class="label">剔除</span><span class="num ${s.excluded?'block':''}">${s.excluded}</span></div><div class="mini"><span class="label">调整</span><span class="num ${s.adjusted?'review':''}">${s.adjusted}</span></div></div>
  ${Object.keys(s.excluded_reasons||{}).length?`<p class="muted" style="margin:0;font-size:12px">剔除原因：${Object.entries(s.excluded_reasons).map(([k,n])=>`${esc(k)} ${n}`).join('，')}</p>`:''}
  ${(s.errors||[]).length||(s.parse_problems||[]).length?`<div class="note block">${[...(s.errors||[]),...(s.parse_problems||[])].map(x=>`<div>${esc(x)}</div>`).join('')}</div>`:''}`}
VIEWS.payouts=async()=>{if(!member('campaign_payouts'))return notHired('campaign_payouts');
  const d=await api('/api/payouts');S.pay=d;const f=S.payForm||(S.payForm={campaign:'',token:d.tokens.includes('USDT')?'USDT':d.tokens[0]||'USDT',mode:'fixed',pool:'',budget:'',per_person_cap:'',min_amount:'',sybil_check:'',text:''});
  const pv=S.payPreview;
  return `${offNote('campaign_payouts')}
  ${!d.safe?'<div class="note block"><b>还没配置 Safe 多签地址。</b>批次照样能核对和导出名单，但要导出 Safe 批量交易文件，需要在链配置里填 <code>safe_address</code> 和代币合约地址。</div>':''}
  <div class="grid g4">
    ${kpi('待确认批次',d.pending,d.pending?'核对后确认才会生成提案':'没有待确认的',d.pending?'review':'')}
    ${kpi('等 Safe 签字',d.awaiting_signature,'导出文件后在 Safe 里签')}
    ${kpi('已提案金额',Object.entries(d.paid_totals).map(([k,v])=>`${fmtNum(v)} <span class="muted" style="font-size:13px">${esc(k)}</span>`).join('<br>')||'0','含已执行')}
    ${kpi('Safe 多签',d.safe?`<span style="font-size:15px" class="mono">${esc(short(d.safe))}</span>`:'未配置','员工不签名，只出提案',d.safe?'':'review')}
  </div>
  <div class="grid g2" style="align-items:start">
  <div class="stack" style="gap:16px">
  ${card('新建结算批次',`<div class="stack">
    <div class="grid g2" style="gap:8px"><label class="f"><span>活动名称</span><input id="pyCamp" value="${esc(f.campaign)}" placeholder="例如 10 月 KOL 结算" maxlength="80"></label>
    <label class="f"><span>币种</span><select id="pyTok">${d.tokens.map(t=>`<option ${f.token===t?'selected':''}>${esc(t)}</option>`).join('')}</select></label></div>
    <div class="grid g2" style="gap:8px"><label class="f"><span>结算方式</span><select id="pyMode"><option value="fixed" ${f.mode==='fixed'?'selected':''}>按名单金额</option><option value="pool" ${f.mode==='pool'?'selected':''}>按积分分奖池</option></select></label>
    ${f.mode==='pool'?`<label class="f"><span>奖池总额</span><input id="pyPool" class="mono" value="${esc(f.pool)}" placeholder="例如 10000"></label>`:`<label class="f"><span>预算上限（可空）</span><input id="pyBudget" class="mono" value="${esc(f.budget)}" placeholder="超过就不能生成"></label>`}</div>
    <div class="grid g2" style="gap:8px"><label class="f"><span>单人上限（可空）</span><input id="pyCap" class="mono" value="${esc(f.per_person_cap)}" placeholder="${f.mode==='pool'?'超过按上限发':'超过就剔除'}"></label>
    <label class="f"><span>最低发放额（可空）</span><input id="pyMin" class="mono" value="${esc(f.min_amount)}" placeholder="低于就不发，省 gas"></label></div>
    <label class="f"><span>剔除反女巫结果（可选）</span><select id="pySyb"><option value="">不使用</option>${d.sybil_checks.map(c=>`<option value="${c.id}" ${String(f.sybil_check)===String(c.id)?'selected':''}>#${c.id} ${esc(c.name)} · 剔除 ${c.excluded}</option>`).join('')}</select></label>
    <label class="f"><span>名单</span><textarea id="pyText" class="mono" style="min-height:180px" placeholder="${esc(MODE_HELP[f.mode])}">${esc(f.text)}</textarea></label>
    <p class="muted" style="margin:0;font-size:12px">${esc(MODE_HELP[f.mode])}。可以直接从表格复制粘贴，第一行是表头也没关系。同一活动里已经发过的地址会自动剔除。</p>
    <div class="row"><button class="btn" id="pyPrev">核对预览</button><button class="btn signal" id="pyMake" ${pv&&pv.ok?'':'disabled'}>生成批次</button><span class="muted" style="font-size:12px">${pv?(pv.ok?'预览通过，可以生成':'预览有问题，改好再生成'):'先预览，看清楚再生成'}</span></div>
    ${pv?`<div class="stack" id="pyPv">${paySummary(pv.summary,pv.summary.token)}</div>`:''}</div>`,{id:'pyNew'})}
  ${pv?card('预览明细',payItems(pv.items),{flush:true}):''}
  </div>
  <div class="stack" style="gap:16px">
  ${card('结算批次',d.batches.length?`<div class="scroll"><table><thead><tr><th>#</th><th>活动</th><th style="text-align:right">合计</th><th>状态</th></tr></thead><tbody>${d.batches.map(b=>`<tr class="click" data-batch="${b.id}"><td class="mono">${b.id}</td><td>${esc(b.campaign)}<div class="muted" style="font-size:11px">${fmtTime(b.at)} · ${b.summary.payable} 个地址${b.summary.excluded?` · 剔除 ${b.summary.excluded}`:''}</div></td><td class="num" style="text-align:right;white-space:nowrap">${fmtNum(b.summary.total)} <span class="muted">${esc(b.token)}</span></td><td>${bst(b.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">还没有结算批次</div>',{flush:true})}
  ${card('怎么发出去',`<ol class="steps"><li>粘贴名单，结算员核对地址、去重、对风险名单和反女巫结果，按规则算出每人多少。</li><li>老板看过明细，点「确认并生成提案」。</li><li>下载 Safe 批量交易文件，在 Safe{Wallet} 的 Transaction Builder 里导入（或用 CSV Airdrop 应用导入 CSV），多签人一次签完。</li><li>执行后把交易哈希填回来，结算员记账；同一活动下这些地址不会再被重复发放。</li></ol><p class="muted" style="margin:8px 0 0;font-size:12px">结算员不持有私钥、不签名、不发交易。所有批量付款都要经过 Safe 多签。</p>`)}
  </div></div>`};
BIND.payouts=()=>{if(!$('#pyPrev'))return;
  const form=()=>{const f=S.payForm;f.campaign=$('#pyCamp').value;f.token=$('#pyTok').value;f.mode=$('#pyMode').value;if($('#pyPool'))f.pool=$('#pyPool').value;if($('#pyBudget'))f.budget=$('#pyBudget').value;
    f.per_person_cap=$('#pyCap').value;f.min_amount=$('#pyMin').value;f.sybil_check=$('#pySyb').value;f.text=$('#pyText').value;return f};
  const body=f=>({campaign:f.campaign,text:f.text,sybil_check:f.sybil_check?+f.sybil_check:null,rules:{token:f.token,mode:f.mode,pool:f.mode==='pool'?f.pool:null,budget:f.mode==='fixed'?f.budget:null,per_person_cap:f.per_person_cap,min_amount:f.min_amount}});
  document.querySelectorAll('#pyNew input,#pyNew textarea,#pyNew select').forEach(el=>el.addEventListener('input',()=>{form();if(S.payPreview){S.payPreview=null;$('#pyMake').disabled=true}}));
  $('#pyMode').onchange=()=>{form();S.payPreview=null;render()};
  $('#pyPrev').onclick=async()=>{const f=form();try{S.payPreview=await post('/api/payouts/preview',body(f));render()}catch(e){toast(e.message,true)}};
  $('#pyMake').onclick=async()=>{const f=form(),s=S.payPreview?.summary;if(!s)return;
    if(!await confirmBox('生成结算批次？',`「${esc(f.campaign||'（未填活动名）')}」：${s.payable} 个地址，合计 ${esc(fmtNum(s.total))} ${esc(s.token)}，剔除 ${s.excluded} 个。<br>生成后还要老板再确认一次，才会出 Safe 提案文件。`,'生成'))return;
    try{const b=await post('/api/payouts/batches',body(f));S.payPreview=null;S.payForm=null;toast(`批次 #${b.id} 已生成，等老板确认`);await refresh();openBatch(b.id)}catch(e){toast(e.message,true)}};
  document.querySelectorAll('[data-batch]').forEach(tr=>tr.onclick=()=>openBatch(+tr.dataset.batch))};
async function openBatch(id){let b;try{b=await api('/api/payouts/batches/'+id)}catch(e){return toast(e.message,true)}
  const ok=b.items.filter(i=>i.status==='ok'),r=b.rules;
  drawer(`结算批次 #${b.id}`,`<div class="stack">
    <div class="row">${bst(b.status)}<span class="grow"></span><span class="muted" style="font-size:12px">${fmtTime(b.at)} · ${esc(b.created_by)}${b.decided_by?` · ${esc(b.decided_by)} ${fmtTime(b.decided_at)}`:''}</span></div>
    <h3 style="margin:0">${esc(b.campaign)}</h3>
    ${paySummary(b.summary,b.token)}
    <p class="muted" style="margin:0;font-size:12px">规则：${r.mode==='pool'?`按积分分奖池 ${esc(r.pool)} ${esc(r.token)}`:`按名单金额${r.budget?`，预算 ${esc(r.budget)}`:''}`}${r.per_person_cap?`，单人上限 ${esc(r.per_person_cap)}`:''}${Number(r.min_amount)?`，最低 ${esc(r.min_amount)}`:''}${r.sybil_check?`，剔除反女巫检查 #${r.sybil_check}`:''}</p>
    ${b.tx_hash?`<p style="margin:0">交易：${b.tx_url?`<a href="${esc(b.tx_url)}" target="_blank" rel="noreferrer" class="mono">${esc(short(b.tx_hash))}</a>`:`<span class="mono">${esc(b.tx_hash)}</span>`}</p>`:''}
    ${b.note?`<p class="muted" style="margin:0">备注：${esc(b.note)}</p>`:''}
    <div class="row" style="flex-wrap:wrap">
    ${b.status==='draft'?`<button class="btn signal" data-bact="propose">确认并生成提案</button>`:''}
    ${['proposed','executed'].includes(b.status)?`<button class="btn primary" data-bexp="safe_json">下载 Safe 批量交易</button><button class="btn" data-bexp="csv_airdrop">下载 CSV Airdrop</button><button class="btn" data-bexp="list">下载名单</button>`:''}
    ${b.status==='proposed'?`<button class="btn ok" data-bact="executed">标记已执行</button>`:''}
    ${['draft','proposed'].includes(b.status)?`<button class="btn ghost block" data-bact="cancel">作废</button>`:''}</div>
    <h3 style="margin:8px 0 0">明细（发放 ${ok.length} / 共 ${b.items.length} 行）</h3>
    <div style="margin:0 -16px">${payItems(b.items,500)}</div></div>`);
  document.querySelectorAll('[data-bexp]').forEach(x=>x.onclick=()=>download(`/api/payouts/batches/${id}/export/${x.dataset.bexp}`,'演示版不能下载文件。正式版会下载 Safe{Wallet} 可以直接导入的批量交易文件。'));
  document.querySelectorAll('[data-bact]').forEach(x=>x.onclick=async()=>{const a=x.dataset.bact;let extra={};
    if(a==='propose'&&!await confirmBox(`确认批次 #${id}？`,`${ok.length} 笔，合计 ${esc(fmtNum(b.summary.total))} ${esc(b.token)}。确认后可以下载 Safe 批量交易文件，钱要等多签人在 Safe 里签完才会动。`,'确认'))return;
    if(a==='executed'){const h=await promptBox(`批次 #${id} 已在 Safe 执行`,'把 Safe 执行后的交易哈希填进来，方便以后核对（可空）。','交易哈希','','标记已执行',80);if(h===null)return;extra={tx_hash:h}}
    if(a==='cancel'){const n=await promptBox(`作废批次 #${id}？`,'作废后不能再导出。如果已经在 Safe 里提交了，记得在 Safe 里也拒绝掉。','原因（可空）','','作废',200);if(n===null)return;extra={note:n}}
    try{await post(`/api/payouts/batches/${id}/${a}`,extra);toast({propose:'已确认，可以下载 Safe 文件',executed:'已标记执行',cancel:'已作废'}[a]);await refresh();openBatch(id)}catch(e){toast(e.message,true)}})}

// ---------- airdrop sybil ----------
const VERD={clean:['干净','ok'],review:['待复核','review'],excluded:['剔除','block']};
VIEWS.sybil=async()=>{if(!member('airdrop_sybil'))return notHired('airdrop_sybil');
  const d=await api('/api/sybil');S.syb=d;const s=d.settings,R=d.rule_names;
  const cur=S.sybSel||d.checks.find(c=>c.status!=='failed')?.id;const c=cur?await api('/api/sybil/checks/'+cur).catch(()=>null):null;
  clearTimeout(S.sybTimer);if(d.checks.some(x=>x.status==='running'))S.sybTimer=setTimeout(()=>{if(S.route==='sybil'&&!$('#overlay').innerHTML)render()},2500);
  const res=c?.result,vf=S.sybF??(res=>res&&res.counts.excluded?'excluded':'')(c?.result);

    ${kpi('女巫团伙',res?res.clusters.length:'—',res?.clusters.length?`最大 ${res.clusters[0].size} 个地址`:'没有发现团伙')}
    ${kpi('数据来源',d.ready?'Etherscan':'导入资料',d.ready?'免费档每秒 5 次，1000 个地址约 4 分钟':'设置 API key 后自动查')}
  </div>
  <div class="grid g2" style="align-items:start">
  <div class="stack" style="gap:16px">
  ${c?card(`检查 #${c.id} · ${esc(c.name)}`,c.status==='running'?`<div class="stack"><div class="row"><span class="spin"></span><span>正在查链上数据：${c.progress} / ${c.total}</span></div><div class="bar"><i style="width:${c.total?Math.round(c.progress/c.total*100):0}%"></i></div><p class="muted" style="margin:0;font-size:12px">可以离开这一页，查完会记在审计日志里。</p></div>`
    :c.status==='failed'?`<div class="note block">检查失败：${esc(c.error)}</div>`
    :`<div class="stack">
      <div class="grid g4" style="gap:8px">${['clean','review','excluded'].map(v=>`<div class="mini"><span class="label">${VERD[v][0]}</span><span class="num ${v==='excluded'&&res.counts[v]?'block':v==='review'&&res.counts[v]?'review':''}">${res.counts[v]}</span></div>`).join('')}<div class="mini"><span class="label">干净名单</span><span class="num">${res.clean.length}</span></div></div>
      <p class="muted" style="margin:0;font-size:12px">共 ${res.total} 个地址${res.duplicates?`，名单里重复 ${res.duplicates} 次`:''}${res.invalid.length?`，${res.invalid.length} 行不是有效地址`:''}；查到链上数据 ${res.with_data} 个${res.lookup_errors?`，${res.lookup_errors} 个查询失败`:''}。干净名单${s.review_as==='exclude'?'不含':'包含'}待复核地址。</p>
      ${Object.keys(res.by_rule).length?`<p style="margin:0;font-size:13px">${Object.entries(res.by_rule).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<span class="pill muted" style="margin:0 4px 4px 0">${esc(R[k]||k)} ${n}</span>`).join('')}</p>`:''}
      <div class="row" style="flex-wrap:wrap"><button class="btn signal" id="sybPay">干净名单交给营销结算员</button><button class="btn" data-sybexp="clean">下载干净名单</button><button class="btn" data-sybexp="excluded">下载剔除名单和理由</button><button class="btn ghost" data-sybexp="all">下载全部</button></div></div>`)
    :card('检查结果','<div class="empty">还没有检查。在右边粘贴空投名单开始。</div>')}
  ${res?card('团伙',res.clusters.length?`<div class="scroll"><table><thead><tr><th>#</th><th>地址数</th><th>特征</th><th>资金来源</th></tr></thead><tbody>${res.clusters.slice(0,50).map(k=>`<tr class="click" data-sybf="c:${k.id}"><td class="mono">${k.id}</td><td class="num">${k.size}</td><td>${k.kinds.map(x=>esc(R[x]||x)).join('、')}</td><td class="mono">${k.funder?esc(short(k.funder)):'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">没有发现团伙</div>',{flush:true}):''}
  ${res?card('地址明细',`<div class="tabs" role="tablist" style="margin:-14px -16px 0">${[['','全部'],['excluded','剔除'],['review','待复核'],['clean','干净'],...(vf.startsWith('c:')?[[vf,'团伙 #'+vf.slice(2)]]:[])].map(([v,l])=>`<button role="tab" aria-selected="${vf===v}" data-sybf="${v}">${esc(l)}</button>`).join('')}</div>
    ${rows.length?`<div class="scroll" style="margin:0 -16px -14px"><table><thead><tr><th>地址</th><th>结果</th><th>理由</th></tr></thead><tbody>${rows.slice(0,300).map(a=>`<tr><td class="mono" style="white-space:nowrap">${esc(short(a.address))}${a.cluster?`<div class="muted" style="font-size:11px">团伙 #${a.cluster}</div>`:''}</td><td><span class="pill ${VERD[a.verdict][1]}">${VERD[a.verdict][0]}</span></td><td style="font-size:12px">${a.reasons.length?a.reasons.map(r=>`<div>${r.severity==='high'?'🔴':r.severity==='medium'?'🟡':'⚪'} ${esc(r.text)}</div>`).join(''):'<span class="muted">没有发现问题</span>'}</td></tr>`).join('')}</tbody></table>${rows.length>300?`<p class="muted" style="font-size:12px;margin:8px 16px">只显示前 300 个，下载可以看全部。</p>`:''}</div>`:'<div class="empty">没有</div>'}`):''}
  </div>
  <div class="stack" style="gap:16px">
  ${card('新的检查',`<div class="stack"><label class="f"><span>名单名称</span><input id="sybName" placeholder="例如 第一期空投" maxlength="80"></label>
    <label class="f"><span>地址名单</span><textarea id="sybText" class="mono" style="min-height:160px" placeholder="每行一个地址，或者直接粘贴表格（取第一列）"></textarea></label>

  ${d.checks.length?card('历史检查',`<div class="scroll"><table><tbody>${d.checks.map(x=>`<tr class="click" data-sybsel="${x.id}" ${x.id===cur?'aria-current="true"':''}><td class="mono">#${x.id}</td><td>${esc(x.name)}<div class="muted" style="font-size:11px">${fmtTime(x.at)} · ${x.total} 个地址</div></td><td>${x.status==='running'?`<span class="pill review">进行中 ${x.progress}/${x.total}</span>`:x.status==='failed'?'<span class="pill block">失败</span>':`<span class="muted" style="font-size:12px;white-space:nowrap">剔除 ${x.counts.excluded} · 团伙 ${x.clusters}</span>`}</td></tr>`).join('')}</tbody></table></div>`,{flush:true}):''}
  ${card('判定规则',`<div class="stack">
    <div class="grid g2" style="gap:8px"><label class="f"><span>几个地址算一个团伙</span><input id="sbMin" class="mono" value="${s.cluster_min}"></label><label class="f"><span>批量创建时间窗口（分钟）</span><input id="sbWin" class="mono" value="${s.window_minutes}"></label></div>
    <div class="grid g2" style="gap:8px"><label class="f"><span>少于几笔交易算没活动</span><input id="sbTx" class="mono" value="${s.min_tx}"></label><label class="f"><span>这天之后新建的算新钱包</span><input id="sbAfter" class="mono" value="${esc(s.created_after)}" placeholder="2026-09-01（可空）"></label></div>
    <label class="f"><span>忽略的资金来源（交易所热钱包、水龙头、跨链桥，一行一个）</span><textarea id="sbIgn" class="mono" placeholder="0x…">${esc(s.ignore_funders.join('\n'))}</textarea></label>
    <label class="f"><span>待复核的地址</span><select id="sbRev"><option value="keep" ${s.review_as==='keep'?'selected':''}>留在干净名单里（只剔除高危）</option><option value="exclude" ${s.review_as==='exclude'?'selected':''}>也一起剔除（更严格）</option></select></label>
    <div class="row"><button class="btn primary" id="sbSave">保存规则</button></div>
    <p class="muted" style="margin:0;font-size:12px">🔴 高危直接剔除：同一资金来源、名单内互相打钱（3 个以上）、批量创建、操作完全相同、风险名单。🟡 待复核：几乎没活动、快照前新建、两个地址互相打钱。每条都写清楚理由，方便人工复核和对外解释。</p></div>`)}
  ${card('导入链上资料（可选）',`<div class="stack"><p class="muted" style="margin:0;font-size:12px">已经有数据的话可以直接导入，不用再查。每行：地址,第一笔资金来源,首次交易时间,交易数[,首笔金额]</p>
    <textarea id="sbProf" class="mono" placeholder="0xabc…,0xfunder…,2026-09-03T10:00:00,4,0.01"></textarea><div class="row"><button class="btn" id="sbImp">导入</button></div></div>`)}
  </div></div>`};
BIND.sybil=()=>{if(!$('#sybGo'))return;
  $('#sybGo').onclick=async()=>{const text=$('#sybText').value.trim();if(!text)return toast('先粘贴地址名单',true);
    try{const r=await post('/api/sybil/checks',{name:$('#sybName').value,text});S.sybSel=r.id;S.sybF=undefined;toast(`检查 #${r.id} 已开始`);render()}catch(e){toast(e.message,true)}};
  document.querySelectorAll('[data-sybsel]').forEach(tr=>tr.onclick=()=>{S.sybSel=+tr.dataset.sybsel;S.sybF=undefined;render()});
  document.querySelectorAll('[data-sybf]').forEach(b=>b.onclick=()=>{S.sybF=b.dataset.sybf;render()});
  document.querySelectorAll('[data-sybexp]').forEach(b=>b.onclick=()=>{const id=S.sybSel||S.syb.checks.find(c=>c.status!=='failed')?.id;download(`/api/sybil/checks/${id}/export/${b.dataset.sybexp}`)});
  $('#sybPay')&&($('#sybPay').onclick=async()=>{const id=S.sybSel||S.syb.checks.find(c=>c.status!=='failed')?.id;let c;try{c=await api('/api/sybil/checks/'+id)}catch(e){return toast(e.message,true)}
    if(!member('campaign_payouts')){toast('先在团队里雇佣营销结算员');location.hash='#team';return}
    S.payForm={campaign:c.name,token:(S.pay?.tokens||['USDT']).includes('USDT')?'USDT':S.pay.tokens[0],mode:'pool',pool:'',budget:'',per_person_cap:'',min_amount:'',sybil_check:String(c.id),text:c.result.clean.map(a=>a+',1').join('\n')};S.payPreview=null;
    toast(`已把 ${c.result.clean.length} 个干净地址交给营销结算员：每人积分 1（平分奖池），填上奖池总额就能核对`);location.hash='#payouts'});
  $('#sbSave').onclick=()=>act(()=>put('/api/sybil/settings',{cluster_min:+$('#sbMin').value,window_minutes:+$('#sbWin').value,min_tx:+$('#sbTx').value,created_after:$('#sbAfter').value.trim(),ignore_funders:splitList($('#sbIgn').value),review_as:$('#sbRev').value}),'规则已保存，下次检查生效');
  $('#sbImp').onclick=async()=>{const text=$('#sbProf').value.trim();if(!text)return toast('先粘贴资料',true);try{const r=await post('/api/sybil/profiles',{text});toast(`导入了 ${r.imported} 个地址的资料`);render()}catch(e){toast(e.message,true)}}};

// ---------- boot ----------
function applyTheme(){const t=store.get('cs-theme','dark'),r=document.documentElement;r.removeAttribute('data-auto');
  if(t==='auto'){r.removeAttribute('data-theme');r.setAttribute('data-auto','1')}else r.setAttribute('data-theme',t)}
let timer;function startAuto(){clearInterval(timer);const s=+store.get('cs-auto','60');if(s)timer=setInterval(()=>{if(document.visibilityState==='visible'&&!$('#overlay').innerHTML&&!S.dirtyRules&&!(document.activeElement&&document.activeElement.matches('input,textarea,select')))refresh()},s*1000)}
function logout(msg){token='';try{sessionStorage.removeItem('cs-token')}catch(e){}$('#app').hidden=true;$('#login').hidden=false;$('#loginMsg').textContent=msg||'';clearInterval(timer)}
async function connect(){token=$('#token').value.trim()||token;if(!token)return;
  try{await api('/api/status');try{sessionStorage.setItem('cs-token',token)}catch(e){}$('#login').hidden=true;$('#app').hidden=false;S.route=route();await refresh();startAuto()}
  catch(e){$('#loginMsg').textContent=e.message}}
$('#connect').onclick=connect;$('#token').onkeydown=e=>{if(e.key==='Enter')connect()};
applyTheme();
if(window.CONSOLE_DEMO){$('#demoBar').hidden=false;$('#demoBar').innerHTML=window.CONSOLE_DEMO}
// Optional link back to the company site (set window.CONSOLE_HOME before this script).
if(window.CONSOLE_HOME){const h=esc(window.CONSOLE_HOME);$('.brand').insertAdjacentHTML('beforeend',`<a class="home" href="${h}" target="_top">← 官网</a>`);
  if(window.CONSOLE_DEMO)$('#demoBar').insertAdjacentHTML('beforeend',`<a class="home" href="${h}" target="_top">← 返回官网</a>`)}
if(token)connect();
})();
</script>
</body>
